<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="forgotpassword.css" />
</head>

<body>
  <div class="forgot-form">
    <h1>Forgot Password</h1>
    <p id="forgotDesc">Enter your email and we'll send you a link to reset your password.</p>

    <form id="forgotForm">
      <input type="email" id="email" name="email" placeholder="Email:" required />
      <button type="submit" id="sendBtn">Send Reset Link</button>
    </form>

    <p id="forgotSuccess" hidden>If an account exists for that email, a reset link has been sent.</p>

    <a href="Home.html" id="homee">Home →</a>
  </div>

  <script src="forgotpassword.js"></script>
</body>

</html>
